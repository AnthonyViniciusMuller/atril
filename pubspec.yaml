name: atril
description: "Cliente Flutter para Quire — biblioteca de e-books federada e offline-first."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The runtime the generated contract under lib/data/services/api/generated is
  # compiled against. `grpc` carries both channels the app needs — ClientChannel
  # over HTTP/2 for the five native targets and GrpcWebClientChannel for the
  # browser — which is why one package covers a split that architecture.md
  # describes as the only conditional import in the project.
  #
  # `fixnum` is a direct dependency and not an incidental one: an int64 field
  # arrives as Int64 and has to stay Int64 until the mapper, so this package is
  # named in the signatures data/model is written against.
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  grpc: ^5.1.0

  # The one logging substrate, and the closest thing Dart has to the log/slog
  # the node is written against: named loggers in a hierarchy, a level per
  # logger, and records a single listener decides what to do with. utils/logging
  # installs that listener; nothing else in the app writes anywhere.
  logging: ^1.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # The local replica, and the reason architecture.md calls it the mechanism
  # rather than a cache: every change is authored here and pushed, because a
  # change made through the node's write RPCs replicates to nobody (C21).
  #
  # `sqlite3` is a direct dependency and not drift's alone: from its version 3
  # it builds and bundles SQLite itself through Dart's build hooks, which is
  # what retired `sqlite3_flutter_libs`, and the Android temporary directory is
  # set through its API in the connection.
  drift: ^2.34.3
  sqlite3: ^3.5.2

  # Where the database file goes on each of the five native targets, and how a
  # path is joined without assuming a separator. `path_provider` is what knows
  # that application support is not the documents directory a file manager
  # shows the reader.
  path_provider: ^2.1.6
  path: ^1.9.1

  # Where the refresh credential is kept between two runs of the app. It is
  # one package covering all six targets and not five: the web implementation
  # is `localStorage` with an AES key that is itself in `localStorage`, which
  # is obfuscation and not secrecy, and `SecureSessionStore` says so where a
  # reader can be told. That is the honest shape of the promise a browser can
  # keep, and it is the reason the store is an interface with more than one
  # implementation behind it.
  #
  # On Linux it is libsecret, so a build host needs `libsecret-1-dev` and
  # `libjsoncpp-dev`; CI installs both beside the GTK headers.
  #
  # Held below 11 deliberately, and not because 11 is new: its Android archive
  # declares that it must be compiled against SDK 37, and the Android Gradle
  # plugin this Flutter release ships names 36 as the highest it supports. The
  # build fails at `checkDebugAarMetadata` and the fix would be a toolchain
  # ahead of the pinned Flutter rather than a line in this file. Raise it when
  # `flutter --version` brings an AGP that compiles against 37.
  flutter_secure_storage: ^10.3.1

  # The browser's own APIs, typed. It is what the web half of the blob store
  # reaches the origin-private file system through, and what the storage budget
  # asks `navigator.storage.estimate()` with. Nothing outside a `_web.dart`
  # file imports it: it does not parse for the other five targets.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # drift's tables are Dart classes and its queries are generated from them, so
  # `make gen` runs build_runner as well as protoc. The output is committed for
  # the reason the generated contract is, and CI regenerates and diffs it.
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  crypto: ^3.0.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
