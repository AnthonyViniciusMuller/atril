name: atril
description: "Cliente Flutter para Quire — biblioteca de e-books federada e offline-first."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The delegates that teach the framework's own widgets a locale: the date
  # and number formats, the reading direction, and the strings inside
  # Material's dialogs and its text-selection menu. Without them a translated
  # app is translated only where this project wrote the string, and the copy
  # button in a text field is still in English.
  flutter_localizations:
    sdk: flutter

  # What `flutter gen-l10n` compiles the ARB files against. It is a direct
  # dependency because the generated code imports it, and the constraint is
  # `any` because the Flutter SDK pins the version `flutter_localizations`
  # resolves to and a second opinion here can only conflict with it.
  intl: any

  # The runtime the generated contract under lib/data/services/api/generated is
  # compiled against. `grpc` carries both channels the app needs — ClientChannel
  # over HTTP/2 for the five native targets and GrpcWebClientChannel for the
  # browser — which is why one package covers a split that architecture.md
  # describes as the only conditional import in the project.
  #
  # `fixnum` is a direct dependency and not an incidental one: an int64 field
  # arrives as Int64 and has to stay Int64 until the mapper, so this package is
  # named in the signatures data/model is written against.
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  grpc: ^5.1.0

  # Dependency injection, as the architecture guide's own sample does it: one
  # graph built at the entry point, `context.read<T>()` where a view model is
  # constructed, and `dispose` called for us when a provider goes away. It is
  # also what closes the one real cycle in this app — the session holds the
  # client that refreshes it and the client makes its calls under the session —
  # since a provider is created on first read and not before.
  #
  # `ChangeNotifier` is already this project's idiom: `Command` extends it, and
  # a view model that exposes commands is a listenable a `Consumer` can watch
  # without anything being adapted to anything.
  provider: ^6.1.5

  # Navigation, as the architecture guide's own sample does it: one route
  # table, addressable locations, and a redirect that runs before a route is
  # built. The redirect is the reason it is this package and not `Navigator`
  # directly — the question *may this device see this screen* is asked in one
  # place about every location, and the alternative is each screen checking for
  # itself and one of them eventually not.
  #
  # It also gives the web target real URLs, which is not a nicety there: a
  # browser has a back button and an address bar whether or not this app
  # accounts for them.
  go_router: ^17.4.0

  # The one logging substrate, and the closest thing Dart has to the log/slog
  # the node is written against: named loggers in a hierarchy, a level per
  # logger, and records a single listener decides what to do with. utils/logging
  # installs that listener; nothing else in the app writes anywhere.
  logging: ^1.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # The local replica, and the reason architecture.md calls it the mechanism
  # rather than a cache: every change is authored here and pushed, because a
  # change made through the node's write RPCs replicates to nobody (C21).
  #
  # `sqlite3` is a direct dependency and not drift's alone: from its version 3
  # it builds and bundles SQLite itself through Dart's build hooks, which is
  # what retired `sqlite3_flutter_libs`, and the Android temporary directory is
  # set through its API in the connection.
  drift: ^2.34.3
  sqlite3: ^3.5.2

  # Where the database file goes on each of the five native targets, and how a
  # path is joined without assuming a separator. `path_provider` is what knows
  # that application support is not the documents directory a file manager
  # shows the reader.
  path_provider: ^2.1.6
  path: ^1.9.1

  # Where the refresh credential is kept between two runs of the app. It is
  # one package covering all six targets and not five: the web implementation
  # is `localStorage` with an AES key that is itself in `localStorage`, which
  # is obfuscation and not secrecy, and `SecureSessionStore` says so where a
  # reader can be told. That is the honest shape of the promise a browser can
  # keep, and it is the reason the store is an interface with more than one
  # implementation behind it.
  #
  # On Linux it is libsecret, so a build host needs `libsecret-1-dev` and
  # `libjsoncpp-dev`; CI installs both beside the GTK headers.
  #
  # Held below 11 deliberately, and not because 11 is new: its Android archive
  # declares that it must be compiled against SDK 37, and the Android Gradle
  # plugin this Flutter release ships names 36 as the highest it supports. The
  # build fails at `checkDebugAarMetadata` and the fix would be a toolchain
  # ahead of the pinned Flutter rather than a line in this file. Raise it when
  # `flutter --version` brings an AGP that compiles against 37.
  flutter_secure_storage: ^10.3.1

  # Whether this device has a network at all, which is a hint and never the
  # answer: the package reports a radio and not a route, so a device on a
  # captive-portal wifi reports `wifi` and reaches nothing. What decides that a
  # node is unreachable is a call that failed; this is what says a retry has
  # become worth making, and — in the one direction it is reliable — that there
  # is no point in trying at all.
  connectivity_plus: ^7.3.1

  # The one call in this app that is not gRPC: the `.well-known/quire/client`
  # lookup a device makes before it has a node to ask anything else of. It is
  # plain HTTP, it has to work on all six targets, and `Client()` is itself the
  # platform split — `dart:io` behind the five native builds and `fetch` behind
  # the browser — which is what keeps discovery one file instead of a fifth
  # conditional export with this project's own code on both sides of it.
  #
  # It is promoted from transitive rather than added: `grpc` already resolves
  # it. The constraint is named here because `data/services/discovery` is
  # written against its API, and depending on somebody else's dependency is how
  # a version bump next door becomes a compile error here.
  #
  # The lookup sends no header of any kind, and that is a constraint of Quire's
  # gateway rather than a style: it admits `GET` on `/.well-known/*` and not
  # `OPTIONS`, so anything that provokes a preflight is refused 403.
  http: ^1.6.0

  # The window on Linux, macOS and Windows: its minimum size, the size it was
  # left at, and the moment it is ready to be shown. Flutter's own embedders
  # expose none of that to Dart — the three runners set a size in C++, Swift
  # and C++ respectively, before any of this app's code has run — so a floor
  # that the adaptive layout can be argued about would otherwise be three
  # native edits nobody reading `lib/` would find.
  #
  # It registers on the three desktop targets only, and nothing outside
  # `config/window.dart` reaches it; the guard there is `defaultTargetPlatform`
  # and not `dart:io`, which does not parse for the web target.
  window_manager: ^0.5.1

  # Where a per-device preference goes when it is not part of the replica.
  #
  # The window's size is the first of them, and it is deliberately not a drift
  # table: the local database is the reader's library — the records that
  # replicate, the log that carries them and the causal state that makes the
  # next change correct — and how wide somebody left a window on one machine
  # is none of those. It also has to be readable before `runApp`, which is
  # before the database is opened.
  shared_preferences: ^2.5.3

  # The browser's own APIs, typed. It is what the web half of the blob store
  # reaches the origin-private file system through, and what the storage budget
  # asks `navigator.storage.estimate()` with. Nothing outside a `_web.dart`
  # file imports it: it does not parse for the other five targets.
  web: ^1.1.1
  # How a reader names the file they are importing. Flutter has no picker of
  # its own on any of the six targets, and this is flutter.dev's — the same
  # publisher as `path_provider` and `shared_preferences`, which is what this
  # project already leans on for a platform edge. It hands back an `XFile`,
  # whose `openRead` is a *stream*: the import hashes a book while it copies
  # it and never holds the bytes twice, which is the whole reason the picker
  # matters more than a path would.
  file_selector: ^1.1.0

  # What an EPUB is, structurally: a zip holding an XML manifest. Both packages
  # are pure Dart and compile on all six targets, which the alternative did not
  # — sqlite's inflate is not available and `dart:io`'s `ZLibCodec` does not
  # exist in a browser, so a hand-rolled reader would have had to carry its own
  # inflate as well as its own XML.
  #
  # They are used in exactly one place, `data/services/epub`, and phase 9's
  # reader needs neither: it hands the file to epub.js, which does its own
  # unzipping inside the host. `xml` is promoted from transitive rather than
  # added, and is named here because this app is written against its API.
  archive: ^4.2.0
  xml: ^7.0.1

  # sha-256, streamed. The digest is what identifies a file across the whole
  # federation, so it is computed as the bytes are read rather than over a
  # buffer holding the book — `startChunkedConversion` is the API that makes
  # the difference, and it is why this is a dependency of the app and not of
  # its tests.
  #
  # It was a dev dependency until this phase, where the import needs it.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # The in-memory preference backend the plugin publishes for exactly this,
  # so that `PreferencesWindowStore` is tested rather than the memory twin
  # beside it — the branch worth covering is a run that wrote a width and no
  # height, and only the real store has it.
  shared_preferences_platform_interface: ^2.4.2

  # Virtual time, for the two places this app waits on purpose: the debounce
  # that keeps a dragged window edge from writing a preference per frame, and
  # phase 11's backoff. It is already here under flutter_test; it is named so
  # that a test importing it depends on it rather than on somebody else's
  # dependency.
  fake_async: ^1.3.3

  # What `tool/check_hardcoded_strings.dart` reads the UI with. Dart ships no
  # lint for a user-visible string written into a widget, and a grep cannot
  # tell `Text('Biblioteca')` from `Key('library')`, so the check parses the
  # files and looks at where a literal actually lands. The package is already
  # here transitively, under build_runner; it is named so that the tool depends
  # on it rather than on somebody else's dependency.
  analyzer: ^13.3.0

  # drift's tables are Dart classes and its queries are generated from them, so
  # `make gen` runs build_runner as well as protoc. The output is committed for
  # the reason the generated contract is, and CI regenerates and diffs it.
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs `flutter gen-l10n` as part of a build, against `l10n.yaml`. The output
  # is also committed and checked in CI, for the reason the contract's stubs
  # and drift's are: a message added to the ARB and not regenerated compiles
  # against the previous class and fails at the call site rather than at the
  # edit.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
