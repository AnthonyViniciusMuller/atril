# The analyzer configuration. `flutter_lints` is the floor; everything below it
# is a rule this project wants argued for rather than inherited.

include: package:flutter_lints/flutter.yaml

analyzer:
  # The three strict modes turn the places the analyzer would otherwise fall
  # back on `dynamic` into diagnostics. This project maps generated protobuf
  # messages onto domain models by hand, and an implicit downcast in a mapper
  # is the failure that surfaces as a widget rendering the wrong field rather
  # than as a compile error.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Logging goes through the logger phase 2 adds, and nowhere else. A `print`
    # left behind is invisible on five of the six targets and is the browser's
    # console on the sixth.
    avoid_print: error

  # `flutter analyze` fails on an `info`, so the lints below do not need
  # promoting to be enforced; only `avoid_print` is raised, because a stray
  # `print` should also stop an IDE rather than tint a line yellow.
  exclude:
    # Generated code is protoc's output and not this project's source. It does
    # not declare return types the way the lints below require, and a warning
    # in it is a warning nobody can act on without editing a file that is
    # rewritten by `make gen`.
    - lib/data/services/api/generated/**
    # drift's output, for the same reason. It is a `part` of the library that
    # declares the tables, so what is excluded here is only the diagnostics
    # raised inside the generated file itself — the code that uses it is
    # analyzed as strictly as everything else.
    - lib/**/*.g.dart
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**

linter:
  rules:
    # An omitted return type reads as `dynamic` and infers as whatever the body
    # happens to produce. Every boundary in this project is typed on purpose.
    - always_declare_return_types
    # A local that is never reassigned says so. It is the cheapest way to keep
    # the reconciler's per-field decisions readable.
    - prefer_final_locals
    # One argument per line, so that adding a field is a one-line diff and a
    # review sees the field rather than the reflow around it.
    - require_trailing_commas
