# The analyzer configuration. `flutter_lints` is the floor; everything below it
# is a rule this project wants argued for rather than inherited.

include: package:flutter_lints/flutter.yaml

analyzer:
  # The three strict modes turn the places the analyzer would otherwise fall
  # back on `dynamic` into diagnostics. This project maps generated protobuf
  # messages onto domain models by hand, and an implicit downcast in a mapper
  # is the failure that surfaces as a widget rendering the wrong field rather
  # than as a compile error.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Logging goes through the logger phase 2 adds, and nowhere else. A `print`
    # left behind is invisible on five of the six targets and is the browser's
    # console on the sixth.
    avoid_print: error

  # `flutter analyze` fails on an `info`, so the lints below do not need
  # promoting to be enforced; only `avoid_print` is raised, because a stray
  # `print` should also stop an IDE rather than tint a line yellow.
  exclude:
    # Generated code is protoc's output and not this project's source. It does
    # not declare return types the way the lints below require, and a warning
    # in it is a warning nobody can act on without editing a file that is
    # rewritten by `make gen`.
    - lib/data/services/api/generated/**
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**

linter:
  rules:
    # An omitted return type reads as `dynamic` and infers as whatever the body
    # happens to produce. Every boundary in this project is typed on purpose.
    - always_declare_return_types
    # A local that is never reassigned says so. It is the cheapest way to keep
    # the reconciler's per-field decisions readable.
    - prefer_final_locals
    # One argument per line, so that adding a field is a one-line diff and a
    # review sees the field rather than the reflow around it.
    - require_trailing_commas
    # A future nobody waits for is a failure nobody sees. `discarded_futures`
    # names the call in a synchronous body and `unawaited_futures` the one in
    # an asynchronous body; between them they cover every place a `Result` can
    # be dropped on the floor. A command deliberately runs unawaited — the
    # screen listens to it instead — and `unawaited()` is how that is said out
    # loud rather than left to the reader.
    - discarded_futures
    - unawaited_futures
    # A subscription this project opens is one it has to cancel. The replica's
    # watches and the sync channels both outlive the call that creates them,
    # and phase 14 found two channels that had stopped being read without
    # anybody hanging up.
    - cancel_subscriptions
    # `dynamic` reaches this project through the bridge and through protobuf.
    # A call on one is the implicit downcast `strict-casts` forbids, arriving a
    # layer later and at run time.
    - avoid_dynamic_calls
    # `Result<T>` carries the failure across a boundary. What is thrown in
    # spite of it, inside a layer, should still be something with a stack
    # trace attached.
    - only_throw_errors
    # `close_sinks` is deliberately absent. Every sink here is a field closed
    # by its object's own `close`, and the rule only recognises a close in the
    # function that opened the sink: on this tree it reports the blob write,
    # the sync stream's command channel and the lifecycle broadcast, all three
    # correct, and nothing else. It is a rule that would be carried as a
    # standing list of ignores, which is a worse record of the decision than
    # this paragraph.
