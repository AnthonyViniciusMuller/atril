name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The revision `.metadata` records, so that CI and a laptop disagree about a
  # build failure only when the code is at fault.
  FLUTTER_VERSION: 3.47.1

jobs:
  # The contract is a copy of Quire's proto/quire/v1, and a copy is only worth
  # having if something notices when it stops matching. Quire is where quire.v1
  # is written, so this job clones it and fails when the vendored files have
  # fallen behind — the fix being `make proto-sync`, rather than a client
  # generated against a protocol the node no longer speaks.
  #
  # It is deliberately checked against the default branch and not against a
  # pinned revision: a pin would only catch the copy being hand-edited here,
  # which is the rarer of the two ways it goes wrong.
  contract:
    name: vendored contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the Quire contract
        uses: actions/checkout@v7
        with:
          repository: AnthonyViniciusMuller/quire
          path: .quire

      - name: Compare the vendored copy with Quire
        run: make proto-check QUIRE=.quire

  check:
    name: format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The formatter is checked before the analyzer because a reformatting
      # diff buried in a feature commit is a review that reads the whitespace.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # `analysis_options.yaml` promotes `avoid_print`, and `flutter analyze`
      # fails on an `info`, so this covers every lint the project turned on.
      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  # Six targets, and a commit that builds on five is not done. Each one is a
  # job rather than a step so that a failure names the platform it belongs to.
  #
  # The two Apple targets need a macOS runner. GitHub hosts one, so they are
  # built here rather than excused; a fork running on a self-hosted fleet with
  # no macOS in it should drop those two matrix entries and say so, rather than
  # leaving a green tick that covers four platforms and claims six.
  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: web
            os: ubuntu-latest
            command: flutter build web
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug
          - target: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign
          - target: macos
            os: macos-latest
            command: flutter build macos --debug

    steps:
      - uses: actions/checkout@v7

      # The Android toolchain is the only one that needs a JDK, and the runner
      # image's default is not the one the Gradle plugin expects.
      - name: Set up the JDK
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GTK embedder is built from source, so its headers have to be here.
      - name: Install the Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Debug builds throughout: what is being checked is that the platform
      # embedder still compiles and links, and a release build adds tree
      # shaking and signing to that without adding coverage of it.
      - name: Build
        run: ${{ matrix.command }}
