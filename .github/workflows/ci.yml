name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The revision `.metadata` records, so that CI and a laptop disagree about a
  # build failure only when the code is at fault.
  FLUTTER_VERSION: 3.47.1

  # Kept equal to PROTOC_VERSION in the Makefile. Two protoc releases embed two
  # different descriptors in the generated .pbjson.dart files, so a runner on a
  # different one reports a contract that has changed when nothing has.
  PROTOC_VERSION: '36.0'

jobs:
  # The contract is a copy of Quire's proto/quire/v1, and a copy is only worth
  # having if something notices when it stops matching. Quire is where quire.v1
  # is written, so this job clones it and fails when the vendored files have
  # fallen behind — the fix being `make proto-sync`, rather than a client
  # generated against a protocol the node no longer speaks.
  #
  # It is deliberately checked against the default branch and not against a
  # pinned revision: a pin would only catch the copy being hand-edited here,
  # which is the rarer of the two ways it goes wrong.
  contract:
    name: vendored contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the Quire contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnthonyViniciusMuller/quire
          path: .quire

      - name: Compare the vendored copy with Quire
        run: make proto-check QUIRE=.quire

  check:
    name: format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned code generator
        run: make tools

      # The generated contract is committed, so an RPC added to the .proto and
      # not regenerated would compile against a stale signature and fail a long
      # way from the edit. This is the check Quire runs over its own stubs, and
      # it runs before the formatter and the analyzer so that both of them see
      # the code the contract currently describes.
      #
      # `--intent-to-add` first, because `git diff` says nothing about a file
      # that is untracked, and a generated file that has just appeared is
      # exactly the case where it would be untracked.
      - name: Check that the generated contract is current
        run: |
          make gen-proto
          git add --intent-to-add -- lib/data/services/api/generated
          git diff --exit-code -- lib/data/services/api/generated

      # drift generates the row classes, the companions and the DAOs from the
      # table declarations, and that output is committed for the same reason:
      # a column added without regenerating compiles against the previous shape
      # and fails somewhere else entirely.
      - name: Check that the generated database code is current
        run: |
          make gen-drift
          git add --intent-to-add -- 'lib/**/*.g.dart'
          git diff --exit-code -- 'lib/**/*.g.dart'

      # The strings are compiled from the ARB files into the class the
      # widgets read, and that output is committed too: a message added to
      # `app_pt_BR.arb` without regenerating fails at the call site rather
      # than at the edit. A message added to only one of the two languages is
      # not caught here — gen-l10n reports that into a file, because the
      # deliberately empty `app_pt.arb` would otherwise print a backlog on
      # every build — so `test/ui/core/localization/arb_test.dart` is what
      # holds the two files to each other.
      - name: Check that the generated localizations are current
        run: |
          make gen-l10n
          git add --intent-to-add -- lib/ui/core/localization/generated
          git diff --exit-code -- lib/ui/core/localization/generated

      # The application icon is drawn by a program and its output is
      # committed, so a mark edited in an image editor rather than in the
      # geometry would survive until somebody next ran the generator. The
      # deflate that writes these files is the SDK's, and FLUTTER_VERSION is
      # pinned, which is what makes a byte-for-byte diff meaningful here.
      - name: Check that the application icons are current
        run: |
          make icons
          git add --intent-to-add -- web/icons web/favicon.png \
            android/app/src/main/res ios/Runner/Assets.xcassets \
            macos/Runner/Assets.xcassets windows/runner/resources packaging
          git diff --exit-code -- web/icons web/favicon.png \
            android/app/src/main/res ios/Runner/Assets.xcassets \
            macos/Runner/Assets.xcassets windows/runner/resources packaging

      # No hardcoded user-visible string, from the first screen. Dart ships no
      # lint for it, so `tool/check_hardcoded_strings.dart` parses the UI and
      # looks at where each literal lands.
      - name: Check for hardcoded strings
        run: make l10n-check

      # The web build serves sqlite as WebAssembly and drift's worker beside
      # the app, and those two files are committed. A drift upgrade that did
      # not refresh them produces a build that compiles and then fails at its
      # first statement in a browser, which no other job here would catch.
      - name: Check that the web assets match the resolved drift
        run: make web-assets-check

      # The formatter is checked before the analyzer because a reformatting
      # diff buried in a feature commit is a review that reads the whitespace.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # `analysis_options.yaml` promotes `avoid_print`, and `flutter analyze`
      # fails on an `info`, so this covers every lint the project turned on.
      - name: Analyze
        run: flutter analyze

      # `flutter test --coverage` and then a floor, through the make target, so
      # that the report CI publishes is filtered exactly as a laptop's is. It
      # replaces a plain `flutter test` rather than following one: the same
      # tests run, and running them twice to measure the second pass would
      # double the longest step in this job.
      #
      # The floor is a ratchet. It fails a phase that drops coverage, which is
      # the only thing a number nobody compares cannot do; raising it is a
      # decision that belongs in a diff, like the Android minSdk pin.
      - name: Unit and widget tests, with a coverage floor
        run: make coverage-check

      # The report itself, so that a red floor can be read rather than guessed
      # at. `if: always()` because the run that fails the floor is exactly the
      # run whose report somebody wants.
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

      # Reported and never enforced. This project pins on purpose — an exact
      # `flutter_inappwebview` pre-release, a `drift` matched to the committed
      # web assets — so a step that failed on a newer release would be a red
      # build for a decision somebody already made, and the pull request that
      # proposes the move is Dependabot's job. What this adds is the thing
      # neither of those gives: the whole picture, on the run somebody is
      # already looking at.
      #
      # It writes the summary rather than the log, because a report nobody
      # opens is a report nobody reads, and `continue-on-error` with
      # `if: always()` so that it is present exactly when a build is red and
      # somebody is wondering whether a dependency is why.
      - name: Report the outdated dependencies
        if: always()
        continue-on-error: true
        run: |
          {
            echo '## Outdated dependencies'
            echo
            echo '```'
            flutter pub outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Six targets, and a commit that builds on five is not done. Each one is a
  # job rather than a step so that a failure names the platform it belongs to.
  #
  # The two Apple targets need a macOS runner. GitHub hosts one, so they are
  # built here rather than excused; a fork running on a self-hosted fleet with
  # no macOS in it should drop those two matrix entries and say so, rather than
  # leaving a green tick that covers four platforms and claims six.
  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one release build here, and the exception is argued below
          # rather than in the matrix.
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
          - target: web
            os: ubuntu-latest
            # Through the make target rather than `flutter build web`, because
            # the web build is three flags and a step afterwards — see the
            # comment on `build-web` in the Makefile — and this is the only
            # place `tool/make_service_worker.dart` ever runs.
            command: make build-web
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug
          - target: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign
          - target: macos
            os: macos-latest
            command: flutter build macos --debug

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Android toolchain is the only one that needs a JDK, and the runner
      # image's default is not the one the Gradle plugin expects.
      - name: Set up the JDK
        if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # The GTK embedder is built from source, so its headers have to be
      # here — and so do libsecret's, which is where the session store keeps
      # the refresh credential on this target.
      - name: Install the Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev

      # `pub-cache-key` is the whole of this fix, and the default is what was
      # wrong. `webview_cef` unpacks CEF *into the pub cache* — 3.1 GB, from a
      # 658 MB download — and the action's default pub-cache key expands to
      # `flutter-pub-<os>-<channel>-<version>-<arch>-<sdk hash>`, which names
      # the Flutter release and nothing about this project. Every ubuntu job in
      # a workflow therefore shares one key. The job that populates it first
      # wins, that job is never the one that builds Linux, and `actions/cache`
      # does not re-save on an exact hit — so the CEF-less cache was restored
      # forever and CEF was fetched on every Linux run.
      #
      # A key of its own, carrying `pubspec.lock`, fixes both halves: nothing
      # else writes it, and a `webview_cef` bump is a new key rather than a
      # stale unpack.
      #
      # Only Linux takes it. For the other five, sharing the check job's pub
      # cache is a hit and a saving, and giving each target its own copy would
      # be five caches of the same packages against a repository's 10 GB.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: ${{ matrix.target == 'linux' && format('flutter-pub-cef-:os:-:channel:-:version:-:arch:-{0}', hashFiles('pubspec.lock')) || '' }}

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # Debug builds on five of the six: what is being checked is that the
      # platform embedder still compiles and links, and a release build adds
      # tree shaking and signing to that without adding coverage of it.
      #
      # Android is the exception, because there the release configuration is
      # itself something this repository wrote and nothing exercised. R8 runs
      # only in release, and `android/app/build.gradle.kts` picks a signing
      # config there — falling back to the debug key, announcing it, which is
      # what makes a release build safe on a runner with no keystore. Both of
      # those ran nowhere until now: the workflow that builds release Android
      # is `release.yml`, and it has never run.
      - name: Build
        run: ${{ matrix.command }}
