<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Leia e sincronize uma biblioteca de e-books federada. A biblioteca, as posições de leitura e as anotações ficam no dispositivo.">
  <!-- The ink the application icon is drawn on, so the browser paints the
       chrome and the splash in the app's own colour rather than in white. -->
  <meta name="theme-color" content="#1B2430">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atril">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Atril</title>
  <link rel="manifest" href="manifest.json">

  <!-- The webview's bridge, and the only line the browser target needs that
       the other five do not. `flutter_inappwebview` reaches a native webview
       on the four native targets, and in a browser it drives a same-origin
       `<iframe>` from JavaScript this file has to load: the plugin's Dart half
       registers against `window.flutter_inappwebview_plugin`, and without it
       the registration prints that the plugin is not available and the reader
       opens on a webview that was never created.

       Relative, so that it resolves against the `<base href>` above: a build
       served from a sub-path with `--base-href` would not find an absolute
       `/assets/...`, and the reader would fail on the deployed site and
       nowhere else. -->
  <script type="application/javascript" defer
          src="assets/packages/flutter_inappwebview_web/assets/web/web_support.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
